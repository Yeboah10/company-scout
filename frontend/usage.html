<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage — Company Scout</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        try {
            var saved = localStorage.getItem('scout-theme');
            if (saved === 'light' || saved === 'dark') {
                document.documentElement.setAttribute('data-theme', saved);
            }
        } catch (e) {}
    </script>
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-actions">
                <button
                    id="options-toggle"
                    class="options-toggle"
                    type="button"
                    title="Options"
                    aria-label="Options"
                    aria-haspopup="true"
                    aria-expanded="false"
                >&#9881;</button>
                <div id="options-menu" class="options-menu hidden" role="menu">
                    <a class="options-item" role="menuitem" href="/about">
                        <span class="options-icon">&#9432;</span>
                        <span>How it works</span>
                    </a>
                    <button class="options-item" role="menuitem" type="button" id="menu-theme">
                        <span class="options-icon">&#9788;</span>
                        <span id="menu-theme-label">Switch theme</span>
                    </button>
                    <a class="options-item" role="menuitem" href="/">
                        <span class="options-icon">&#8592;</span>
                        <span>Back to search</span>
                    </a>
                    <form method="post" action="/logout" class="options-signout">
                        <button class="options-item" role="menuitem" type="submit">
                            <span class="options-icon">&#8631;</span>
                            <span>Sign out</span>
                        </button>
                    </form>
                </div>
            </div>
            <a class="brand brand-compact" href="/">
                <span class="brand-mark brand-mark-red"></span>
                <span class="brand-mark brand-mark-amber"></span>
                <span class="brand-name">Company Scout</span>
            </a>
            <h1 class="logo">Usage</h1>
            <p class="tagline">What&rsquo;s left before you hit a free-tier limit.</p>
        </header>

        <div class="usage-actions">
            <a href="/" class="download-btn">&larr; Back to Scout</a>
            <button id="refresh" class="download-btn" type="button">Refresh</button>
        </div>

        <div id="usage-body"></div>

        <p id="usage-caveat" class="usage-caveat"></p>

        <div class="usage-links">
            <a href="https://ai.dev/rate-limit" target="_blank" rel="noopener">Gemini limits &rarr;</a>
            <a href="https://app.tavily.com/" target="_blank" rel="noopener">Tavily usage &rarr;</a>
            <a href="https://dashboard.render.com/" target="_blank" rel="noopener">Render dashboard &rarr;</a>
        </div>
    </div>

    <script src="/static/js/core.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/menu.js"></script>
    <script src="/static/js/usage.js"></script>
</body>
</html>
