<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Company Scout</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        try {
            var saved = localStorage.getItem('scout-theme');
            if (saved === 'light' || saved === 'dark') {
                document.documentElement.setAttribute('data-theme', saved);
            }
        } catch (e) {}
    </script>
</head>
<body class="login-body">
    <main class="login-shell">
        <!-- The identity block: the UM6P and ABS marks, then the product. -->
        <div class="login-brand">
            <span class="login-mark login-mark-red"></span>
            <span class="login-mark login-mark-amber"></span>
            <span class="login-brand-label">UM6P &middot; ABS</span>
        </div>

        <h1 class="login-title">Company<br>Scout</h1>
        <p class="login-kicker">Scout &rarr; Signal &rarr; Decide &rarr; Act</p>

        <form class="login-form" method="post" action="/login">
            <label class="login-label" for="email">Email</label>
            <input
                class="login-input"
                type="email"
                id="email"
                name="email"
                autocomplete="username"
                required
                autofocus
            >

            <label class="login-label" for="password">Password</label>
            <input
                class="login-input"
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <input type="hidden" name="next" id="next-field" value="/">

            <button class="login-submit" type="submit">Sign in</button>
        </form>

        <p id="login-error" class="login-error hidden"></p>

        <p class="login-note">
            Shared report links stay public &mdash; anyone with a
            <code>/r/&hellip;</code> link can read that brief without signing in.
            Signing in is for running new research and seeing what it costs.
        </p>
    </main>

    <script>
        // Carry the page the visitor was trying to reach through the form, and
        // surface a failed attempt without leaving it in the address bar.
        (function () {
            var params = new URLSearchParams(window.location.search);
            var next = params.get('next');
            if (next && next.startsWith('/') && !next.startsWith('//')) {
                document.getElementById('next-field').value = next;
            }
            if (params.get('error')) {
                var el = document.getElementById('login-error');
                el.textContent = 'That email and password did not match. Try again.';
                el.classList.remove('hidden');
            }
        })();
    </script>
</body>
</html>
