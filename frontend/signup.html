<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account — Company Scout</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        try {
            var saved = localStorage.getItem('scout-theme');
            if (saved === 'light' || saved === 'dark') {
                document.documentElement.setAttribute('data-theme', saved);
            }
        } catch (e) {}
    </script>
</head>
<body class="login-body">
    <main class="login-shell">
        <div class="login-brand">
            <span class="login-mark login-mark-red"></span>
            <span class="login-mark login-mark-amber"></span>
            <span class="login-brand-label">UM6P &middot; ABS</span>
        </div>

        <a href="/" class="login-title-link">
            <h1 class="login-title">Company<br>Scout</h1>
        </a>
        <p class="login-kicker">Create an account</p>

        <form class="login-form" method="post" action="/signup">
            <label class="login-label" for="email">Email</label>
            <input
                class="login-input"
                type="email"
                id="email"
                name="email"
                autocomplete="username"
                required
                autofocus
            >

            <label class="login-label" for="password">Password</label>
            <input
                class="login-input"
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <input type="hidden" name="next" id="next-field" value="/">

            <button class="login-submit" type="submit">Create account</button>
        </form>

        <p id="login-error" class="login-error hidden"></p>

        <p class="login-note">
            Already have an account? <a href="/login">Sign in</a>.
        </p>
        <p class="login-note">
            Shared report links stay public &mdash; anyone with a
            <code>/r/&hellip;</code> link can read that brief without an account.
        </p>
    </main>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var next = params.get('next');
            if (next && next.startsWith('/') && !next.startsWith('//')) {
                document.getElementById('next-field').value = next;
            }
            var error = params.get('error');
            if (error) {
                var el = document.getElementById('login-error');
                el.textContent = error;
                el.classList.remove('hidden');
            }
        })();
    </script>
</body>
</html>
