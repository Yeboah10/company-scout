<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account — Company Scout</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        try {
            var saved = localStorage.getItem('scout-theme');
            if (saved === 'light' || saved === 'dark') {
                document.documentElement.setAttribute('data-theme', saved);
            }
        } catch (e) {}
    </script>
</head>
<body class="login-body">
    <main class="login-shell">
        <div class="login-brand">
            <span class="login-mark login-mark-red"></span>
            <span class="login-mark login-mark-amber"></span>
            <span class="login-brand-label">Company Scout</span>
        </div>

        <a href="/" class="login-title-link">
            <h1 class="login-title">Company<br>Scout</h1>
        </a>
        <p class="login-kicker">Create an account</p>

        <form class="login-form" method="post" action="/signup">
            <label class="login-label" for="email">Email</label>
            <input
                class="login-input"
                type="email"
                id="email"
                name="email"
                autocomplete="username"
                required
                autofocus
            >

            <label class="login-label" for="password">Password</label>
            <input
                class="login-input"
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <input type="hidden" name="next" id="next-field" value="/">

            <button class="login-submit" type="submit">Create account</button>
        </form>

        <div class="login-divider"><span>or</span></div>

        <a class="google-btn" href="/auth/google">
            <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign up with Google
        </a>

        <p id="login-error" class="login-error hidden"></p>

        <p class="login-note">
            Already have an account? <a href="/login">Sign in</a>.
        </p>
        <p class="login-note">
            Shared report links stay public &mdash; anyone with a
            <code>/r/&hellip;</code> link can read that brief without an account.
        </p>
    </main>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var next = params.get('next');
            if (next && next.startsWith('/') && !next.startsWith('//')) {
                document.getElementById('next-field').value = next;
            }
            var error = params.get('error');
            if (error) {
                var el = document.getElementById('login-error');
                el.textContent = error;
                el.classList.remove('hidden');
            }
        })();
    </script>
</body>
</html>
