<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set new password — Company Scout</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        try {
            var saved = localStorage.getItem('scout-theme');
            if (saved === 'light' || saved === 'dark') {
                document.documentElement.setAttribute('data-theme', saved);
            }
        } catch (e) {}
    </script>
</head>
<body class="login-body">
    <main class="login-shell">
        <div class="login-brand">
            <span class="login-mark login-mark-red"></span>
            <span class="login-mark login-mark-amber"></span>
            <span class="login-brand-label">Company Scout</span>
        </div>

        <a href="/" class="login-title-link">
            <h1 class="login-title">Company<br>Scout</h1>
        </a>
        <p class="login-kicker">Set a new password</p>

        <form class="login-form" id="new-pw-form">
            <label class="login-label" for="password">New password</label>
            <input
                class="login-input"
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required
                autofocus
            >

            <label class="login-label" for="password2">Confirm password</label>
            <input
                class="login-input"
                type="password"
                id="password2"
                name="password2"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button class="login-submit" type="submit">Set password</button>
        </form>

        <p id="reset-success" class="login-success hidden"></p>
        <p id="reset-error" class="login-error hidden"></p>
        <p id="expired-msg" class="login-error hidden">
            This reset link has expired or is not valid.
            <a href="/forgot-password">Request a new one</a>.
        </p>
    </main>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var token = params.get('token');
            if (!token) {
                document.getElementById('new-pw-form').classList.add('hidden');
                document.getElementById('expired-msg').classList.remove('hidden');
                return;
            }

            document.getElementById('new-pw-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                var pw = document.getElementById('password').value;
                var pw2 = document.getElementById('password2').value;
                var errEl = document.getElementById('reset-error');
                var okEl = document.getElementById('reset-success');
                errEl.classList.add('hidden');
                okEl.classList.add('hidden');

                if (pw !== pw2) {
                    errEl.textContent = 'Passwords do not match.';
                    errEl.classList.remove('hidden');
                    return;
                }

                try {
                    var r = await fetch('/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token, password: pw })
                    });
                    var data = await r.json();
                    if (data.ok) {
                        okEl.textContent = 'Password updated. Redirecting to sign in...';
                        okEl.classList.remove('hidden');
                        document.getElementById('new-pw-form').classList.add('hidden');
                        setTimeout(function () { window.location.href = '/login'; }, 2000);
                    } else {
                        if (data.expired) {
                            document.getElementById('new-pw-form').classList.add('hidden');
                            document.getElementById('expired-msg').classList.remove('hidden');
                        } else {
                            errEl.textContent = data.message || 'Something went wrong.';
                            errEl.classList.remove('hidden');
                        }
                    }
                } catch (err) {
                    errEl.textContent = 'Could not reach the server. Please try again.';
                    errEl.classList.remove('hidden');
                }
            });
        })();
    </script>
</body>
</html>
