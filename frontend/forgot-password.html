<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — Company Scout</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        try {
            var saved = localStorage.getItem('scout-theme');
            if (saved === 'light' || saved === 'dark') {
                document.documentElement.setAttribute('data-theme', saved);
            }
        } catch (e) {}
    </script>
</head>
<body class="login-body">
    <main class="login-shell">
        <div class="login-brand">
            <span class="login-mark login-mark-red"></span>
            <span class="login-mark login-mark-amber"></span>
            <span class="login-brand-label">Company Scout</span>
        </div>

        <a href="/" class="login-title-link">
            <h1 class="login-title">Company<br>Scout</h1>
        </a>
        <p class="login-kicker">Reset your password</p>

        <form class="login-form" id="reset-form">
            <label class="login-label" for="email">Email</label>
            <input
                class="login-input"
                type="email"
                id="email"
                name="email"
                autocomplete="username"
                required
                autofocus
            >

            <button class="login-submit" type="submit">Send reset link</button>
        </form>

        <p id="reset-success" class="login-success hidden"></p>
        <p id="reset-error" class="login-error hidden"></p>

        <p class="login-note">
            Remember your password? <a href="/login">Sign in</a>.
        </p>
    </main>

    <script>
        document.getElementById('reset-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            var errEl = document.getElementById('reset-error');
            var okEl = document.getElementById('reset-success');
            errEl.classList.add('hidden');
            okEl.classList.add('hidden');

            try {
                var r = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                var data = await r.json();
                if (data.ok) {
                    okEl.textContent = data.message;
                    okEl.classList.remove('hidden');
                    document.getElementById('reset-form').classList.add('hidden');
                } else {
                    errEl.textContent = data.message || 'Something went wrong.';
                    errEl.classList.remove('hidden');
                }
            } catch (err) {
                errEl.textContent = 'Could not reach the server. Please try again.';
                errEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
